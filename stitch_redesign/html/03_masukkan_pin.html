<!-- Subtle decorative ambient blobs -->
<div class="relative w-full max-w-5xl mx-auto flex flex-col items-center justify-center py-space-sm px-margin">
<div class="absolute -top-12 -left-16 w-72 h-72 rounded-full bg-secondary-fixed/30 blur-3xl pointer-events-none"></div>
<div class="absolute top-24 -right-16 w-80 h-80 rounded-full bg-tertiary-fixed/25 blur-3xl pointer-events-none"></div>
<!-- Main Card Container -->
<div class="relative w-full max-w-[480px] bg-surface-container-lowest rounded-[28px] p-space-lg sm:p-space-xl shadow-[0_4px_24px_-4px_rgba(0,105,72,0.08),0_12px_32px_-4px_rgba(19,27,46,0.06)] flex flex-col items-center text-center transition-all duration-200">
<!-- Top Decorative Icon Tile -->
<div class="w-14 h-14 rounded-2xl bg-surface-container flex items-center justify-center text-primary mb-space-md shadow-sm">
<span class="material-symbols-outlined text-[30px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<!-- Heading & Meta Information -->
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs font-bold">
        Masukkan PIN 4 Digit
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mb-space-xl">
        Halaman <span class="inline-flex items-center gap-1 font-label-md text-label-md px-2 py-0.5 rounded-lg bg-surface-container-high text-primary font-bold">@perkoa</span> dilindungi dengan PIN
      </p>
<!-- Interactive PIN Form Area -->
<form class="w-full flex flex-col items-center gap-space-lg" id="pin-form" onsubmit="event.preventDefault(); verifyPin();">
<!-- 4 Discrete Digit Boxes -->
<div class="flex items-center justify-center gap-2.5 sm:gap-3.5 w-full" id="pin-inputs-container">
<div class="relative flex items-center justify-center w-[54px] sm:w-[62px] h-[64px] sm:h-[70px] rounded-xl bg-surface-container-low transition-all duration-150 shadow-inner group">
<input aria-label="Digit 1" autocomplete="one-time-code" autofocus="" class="pin-digit w-full h-full text-center bg-transparent text-headline-lg font-headline-lg font-bold text-on-surface outline-none cursor-pointer caret-primary select-none focus:bg-surface-container-lowest rounded-xl" data-index="0" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<div class="dot-indicator pointer-events-none absolute w-3 h-3 rounded-full bg-on-surface scale-0 transition-transform duration-150"></div>
</div>
<div class="relative flex items-center justify-center w-[54px] sm:w-[62px] h-[64px] sm:h-[70px] rounded-xl bg-surface-container-low transition-all duration-150 shadow-inner group">
<input aria-label="Digit 2" class="pin-digit w-full h-full text-center bg-transparent text-headline-lg font-headline-lg font-bold text-on-surface outline-none cursor-pointer caret-primary select-none focus:bg-surface-container-lowest rounded-xl" data-index="1" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<div class="dot-indicator pointer-events-none absolute w-3 h-3 rounded-full bg-on-surface scale-0 transition-transform duration-150"></div>
</div>
<div class="relative flex items-center justify-center w-[54px] sm:w-[62px] h-[64px] sm:h-[70px] rounded-xl bg-surface-container-low transition-all duration-150 shadow-inner group">
<input aria-label="Digit 3" class="pin-digit w-full h-full text-center bg-transparent text-headline-lg font-headline-lg font-bold text-on-surface outline-none cursor-pointer caret-primary select-none focus:bg-surface-container-lowest rounded-xl" data-index="2" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<div class="dot-indicator pointer-events-none absolute w-3 h-3 rounded-full bg-on-surface scale-0 transition-transform duration-150"></div>
</div>
<div class="relative flex items-center justify-center w-[54px] sm:w-[62px] h-[64px] sm:h-[70px] rounded-xl bg-surface-container-low transition-all duration-150 shadow-inner group">
<input aria-label="Digit 4" class="pin-digit w-full h-full text-center bg-transparent text-headline-lg font-headline-lg font-bold text-on-surface outline-none cursor-pointer caret-primary select-none focus:bg-surface-container-lowest rounded-xl" data-index="3" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<div class="dot-indicator pointer-events-none absolute w-3 h-3 rounded-full bg-on-surface scale-0 transition-transform duration-150"></div>
</div>
</div>
<!-- Feedback error message placeholder -->
<div class="h-5 -mt-1 font-body-sm text-body-sm text-error opacity-0 transition-opacity duration-150 flex items-center gap-1 font-semibold" id="pin-error-msg">
<span class="material-symbols-outlined text-[16px]">error</span>

<span id="btn-text" class="">Buka Halaman</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-0.5 transition-transform" id="btn-icon">arrow_forward</span>
</button>

<div class="w-full flex items-center justify-between pt-space-lg mt-space-sm text-on-surface-variant">

<span class="material-symbols-outlined text-[18px]">arrow_back</span>
<span class="">Ganti nama halaman</span>
</a>
<a class="font-label-md text-label-md text-primary hover:text-primary-container font-semibold transition-colors py-1" href="#">
          Lupa PIN?
        </a>
</div>
</div>
<!-- Bottom Feature Ribbon Panel -->

</div>
</div>
<script>
  (function initPinWidget() {
    const inputs = document.querySelectorAll('.pin-digit');
    const container = document.getElementById('pin-inputs-container');
    const errorMsg = document.getElementById('pin-error-msg');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');

    function updateVisuals(input, index) {
      const parent = input.parentElement;
      const dot = parent.querySelector('.dot-indicator');
      if (input.value) {
        dot.classList.remove('scale-0');
        dot.classList.add('scale-100');
        input.classList.add('text-transparent');
      } else {
        dot.classList.remove('scale-100');
        dot.classList.add('scale-0');
        input.classList.remove('text-transparent');
      }
    }

    inputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val ? val[val.length - 1] : '';
        updateVisuals(e.target, idx);
        errorMsg.classList.add('opacity-0');

        if (e.target.value && idx < inputs.length - 1) {
          inputs[idx + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
          if (!input.value && idx > 0) {
            inputs[idx - 1].focus();
            inputs[idx - 1].value = '';
            updateVisuals(inputs[idx - 1], idx - 1);
          } else {
            input.value = '';
            updateVisuals(input, idx);
          }
        } else if (e.key === 'ArrowLeft' && idx > 0) {
          inputs[idx - 1].focus();
        } else if (e.key === 'ArrowRight' && idx < inputs.length - 1) {
          inputs[idx + 1].focus();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 4);
        pasteData.split('').forEach((char, i) => {
          if (inputs[i]) {
            inputs[i].value = char;
            updateVisuals(inputs[i], i);
          }
        });
        const nextFocus = Math.min(pasteData.length, inputs.length - 1);
        inputs[nextFocus].focus();
      });
    });

    window.verifyPin = function() {
      const pin = Array.from(inputs).map(i => i.value).join('');
      
      if (pin.length < 4) {
        shakeInputs();
        errorMsg.textContent = 'Masukkan 4 digit PIN lengkap.';
        errorMsg.classList.remove('opacity-0');
        return;
      }

      // Feedback animation for verification
      btnSubmit.disabled = true;
      btnText.textContent = 'Memverifikasi...';
      btnIcon.textContent = 'sync';
      btnIcon.classList.add('animate-spin');

      setTimeout(() => {
        // Mock verification
        if (pin === '1234' || pin === '0000') {
          btnText.textContent = 'Berhasil!';
          btnIcon.textContent = 'check_circle';
          btnIcon.classList.remove('animate-spin');
          btnSubmit.classList.replace('bg-primary', 'bg-secondary-container');
          btnSubmit.classList.replace('text-on-primary', 'text-on-secondary-container');
          setTimeout(() => {
            alert('Halaman berhasil dibuka! Mengarahkan ke daftar file tugas...');
          }, 300);
        } else {
          btnSubmit.disabled = false;
          btnText.textContent = 'Buka Halaman';
          btnIcon.textContent = 'arrow_forward';
          btnIcon.classList.remove('animate-spin');
          errorMsg.textContent = 'PIN salah. Silakan coba lagi.';
          errorMsg.classList.remove('opacity-0');
          shakeInputs();
          inputs.forEach((i, idx) => {
            i.value = '';
            updateVisuals(i, idx);
          });
          inputs[0].focus();
        }
      }, 650);
    };

    function shakeInputs() {
      container.classList.add('translate-x-[-6px]');
      setTimeout(() => container.classList.replace('translate-x-[-6px]', 'translate-x-[6px]'), 70);
      setTimeout(() => container.classList.replace('translate-x-[6px]', 'translate-x-[-4px]'), 140);
      setTimeout(() => container.classList.replace('translate-x-[-4px]', 'translate-x-[0px]'), 200);
      setTimeout(() => container.classList.remove('translate-x-[0px]'), 220);
    }
  })();
</script></main><footer class="w-full py-space-lg px-margin text-center"></footer></body></html>
